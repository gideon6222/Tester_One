name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    # The engine version is pinned to the same one the game is developed
    # against. Lighting, physics defaults and export template behaviour all
    # move between minor releases; a floating version means CI is testing a
    # different game from the one on the desk.
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v5

      # Godot writes its import cache on first open. Doing it as its own step
      # means a failure here reads as "the project does not import" rather than
      # as a mysterious test failure.
      - name: Import the project
        run: godot --headless --import

      # Pure: no window, no GPU, no scene tree. About a second.
      - name: Unit and golden tests
        run: godot --headless --script res://test/run_tests.gd

      # Boots the real scene. Catches what the pure tests structurally cannot -
      # a scene that fails to build, a node never added, a render path that
      # stopped being flushed.
      - name: Smoke test
        run: godot --headless --script res://test/run_smoke.gd

  android:
    name: Build the APK
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the stamp wants a real sha

      - name: Install the export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls ~/.local/share/godot/export_templates/

      # Find the SDK and JDK the image ships, or install what is missing.
      #
      # Written to report rather than assume: the first version of this step
      # hard-coded /usr/lib/android-sdk and used python3, which is not in this
      # image - the whole job failed with "exit code 127" and nothing else,
      # which says nothing at all about what was wrong.
      - name: Locate or install the Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            for c in /usr/lib/android-sdk /opt/android-sdk /opt/android /root/android-sdk /usr/local/lib/android/sdk; do
              if [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK/platform-tools" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "No usable Android SDK found (SDK='$SDK'); installing one."
            SDK=/opt/android-sdk
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          fi
          JDK="${JAVA_HOME:-}"
          if [ -z "$JDK" ]; then
            JDK=$(dirname "$(dirname "$(readlink -f "$(command -v javac || command -v java)")")")
          fi
          echo "SDK=$SDK"
          echo "JDK=$JDK"
          ls "$SDK"
          test -d "$SDK/platform-tools" || { echo "still no platform-tools"; exit 1; }
          test -d "$SDK/build-tools"   || { echo "still no build-tools"; exit 1; }
          test -x "$JDK/bin/java"      || { echo "no java under $JDK"; exit 1; }
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "JDK_PATH=$JDK"    >> "$GITHUB_ENV"

      # Signing material never lives in the repo. The keystore comes from a
      # base64 repository secret and is written to disk only for this job. With
      # no secret set, a throwaway debug key is generated - fine for an APK you
      # sideload, never for anything going to Play.
      - name: Write the debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_DEBUG_KEYSTORE_B64 not set - generating a throwaway debug key"
            "$JDK_PATH/bin/keytool" -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore /tmp/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          else
            # Keep only base64 characters before decoding. GNU base64 rejects a carriage
            # return, and a secret set from a CRLF file carries one, which fails as
            # "invalid input" and reads like a corrupt keystore. This failed the very
            # first CI run of the first game scaffolded from this template.
            echo "$KEYSTORE_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > /tmp/debug.keystore
          fi
          test -s /tmp/debug.keystore

      # Godot finds all three of these through EDITOR SETTINGS, not through
      # environment variables. Setting ANDROID_HOME alone does nothing, and the
      # error message names "Editor Settings" without saying which file.
      - name: Point Godot at the SDK and the keystore
        run: |
          set -e
          mkdir -p ~/.config/godot
          SETTINGS=~/.config/godot/editor_settings-4.7.tres
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          cat >> "$SETTINGS" <<EOF
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JDK_PATH"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$SETTINGS"

      # The stamp is the only way to tell on a phone whether the build you are
      # holding is the build you just made.
      - name: Stamp the build
        run: |
          set -e
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "s/const SHA := \"[^\"]*\"/const SHA := \"${SHA}\"/" src/build_stamp.gd
          sed -i "s/const BUILT := \"[^\"]*\"/const BUILT := \"${BUILT}\"/" src/build_stamp.gd
          if grep -q 'const SHA := "dev"' src/build_stamp.gd; then
            echo "the stamp did not apply"; exit 1
          fi
          grep 'const ' src/build_stamp.gd

      - name: Export the APK
        run: |
          set -e
          godot --headless --import
          mkdir -p build
          godot --headless --export-debug "Android" build/godot-template.apk
          ls -la build/

      # Fails in both directions. A build that shrinks for no reason has lost
      # something - see the note at the top of the script.
      - name: Size guard
        run: godot --headless --script res://scripts/check_size.gd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: build/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # A release per push to main, so there is always a link to tap on the
      # phone rather than an artifact that needs a login to download.
      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/*.apk
          generate_release_notes: true

  # ── Play release ───────────────────────────────────────────────────────────
  #
  # Only on a version tag, because this is the artifact that goes to a store
  # and it should be a deliberate act rather than a side effect of a push.
  #
  #   git tag v0.2.0 && git push origin v0.2.0
  #
  # Different from the APK job in three ways, all forced by Play:
  #   - an AAB, not an APK; Google builds the per-device APKs from it
  #   - the Gradle build, because AAB export is only valid with it - and it is
  #     also the only way to set target_sdk, which Play requires to be 36 and
  #     which rises every year
  #   - signed with the UPLOAD key from a secret, not a per-run throwaway
  play:
    name: Build the Play bundle
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/ 2>/dev/null || true

      # The Gradle build pulls ~300 MB on a cold run. Cached, later runs are
      # minutes faster and do not depend on Gradle's CDN being reachable.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('export_presets.cfg') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Locate or install the Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            for c in /usr/lib/android-sdk /opt/android-sdk /opt/android /root/android-sdk /usr/local/lib/android/sdk; do
              if [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK/platform-tools" ] || [ ! -d "$SDK/build-tools" ]; then
            SDK=/opt/android-sdk
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          fi
          JDK="${JAVA_HOME:-}"
          if [ -z "$JDK" ]; then
            JDK=$(dirname "$(dirname "$(readlink -f "$(command -v javac || command -v java)")")")
          fi
          echo "SDK=$SDK"; echo "JDK=$JDK"
          test -d "$SDK/platform-tools" || { echo "no platform-tools under $SDK"; exit 1; }
          test -x "$JDK/bin/java"      || { echo "no java under $JDK"; exit 1; }
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "JDK_PATH=$JDK"    >> "$GITHUB_ENV"

      - name: Point Godot at the SDK
        run: |
          set -e
          mkdir -p ~/.config/godot
          SETTINGS=~/.config/godot/editor_settings-4.7.tres
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          cat >> "$SETTINGS" <<EOF
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JDK_PATH"
          EOF

      - name: Write the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_UPLOAD_KEYSTORE_B64 is not set."
            echo "A Play bundle cannot be signed with a throwaway key - Play"
            echo "rejects an upload whose signature does not match the app."
            echo "See PLAY.md for which secrets to add."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > /tmp/upload.keystore
          test -s /tmp/upload.keystore

      - name: Stamp the build
        run: |
          set -e
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "s/const SHA := \"[^\"]*\"/const SHA := \"${SHA}\"/" src/build_stamp.gd
          sed -i "s/const BUILT := \"[^\"]*\"/const BUILT := \"${BUILT}\"/" src/build_stamp.gd
          grep -q 'const SHA := "dev"' src/build_stamp.gd && { echo "stamp did not apply"; exit 1; }
          grep 'const ' src/build_stamp.gd

      # The release keystore is read from these environment variables rather
      # than from editor settings. Godot falls back to editor settings for the
      # DEBUG key only; a release export with no preset keystore and no env
      # vars fails with "Could not find release keystore", which reads like a
      # missing file rather than a missing setting.
      #
      # This is also the right shape for CI regardless: the password never
      # touches a committed file.
      - name: Export the Play bundle
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: upload
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          # Without this, Godot writes a perfectly good bundle and then never
          # exits: Gradle forks a daemon that outlives the build and Godot
          # waits on it. Measured - the process sat at 0% CPU for eight minutes
          # with the AAB already on disk, which in CI is a job that burns until
          # the timeout with nothing wrong. With the daemon off it exits 0.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -e
          godot --headless --import
          mkdir -p build
          # --install-android-build-template only works alongside an export
          # command; on its own it opens the editor and never returns.
          #
          # Bounded, because a hang here is the failure mode this step has
          # already had once. Twenty minutes is generous for a cold Gradle run.
          timeout 20m godot --headless --install-android-build-template \
                --export-release "Android Release" build/godot-template.aab
          ls -la build/

      # Verify the artifact, not the exit code.
      #
      # Godot's release export has returned -1 while producing a valid bundle,
      # and returned 0 while producing nothing when a preset name with a space
      # was split by the caller. Neither the presence of a file nor an exit
      # code is sufficient alone; this checks the thing that actually matters.
      - name: Verify the bundle
        run: |
          set -e
          AAB=build/godot-template.aab
          test -f "$AAB" || { echo "no bundle was produced"; exit 1; }
          SIZE=$(stat -c%s "$AAB")
          echo "bundle is $SIZE bytes"
          # A Godot AAB is ~25 MB; anything under 5 MB is not a real bundle.
          test "$SIZE" -gt 5000000 || { echo "bundle is implausibly small"; exit 1; }
          "$JDK_PATH/bin/jarsigner" -verify "$AAB" | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt || { echo "bundle is not signed"; exit 1; }

      # Play's target API requirement rises every year and an upload below it
      # is rejected. Checking it here turns a yearly thing to remember into a
      # yearly build failure with a clear message.
      # Read from android/build/config.gradle, which is what the build actually
      # consumed, rather than from the bundle. An AAB's manifest is protobuf,
      # not binary XML, so `aapt2 dump xmltree` cannot read it and silently
      # produces nothing - a check that passes on an empty string is worse than
      # no check.
      - name: Verify the target SDK
        run: |
          set -e
          REQUIRED=36   # Play, for new apps and updates from 31 August 2026
          TARGET=$(grep -oP 'targetSdk\s*:\s*\K[0-9]+' android/build/config.gradle | head -1)
          MIN=$(grep -oP 'minSdk\s*:\s*\K[0-9]+' android/build/config.gradle | head -1)
          echo "targetSdk=$TARGET  minSdk=$MIN  (Play requires >= $REQUIRED)"
          test -n "$TARGET" || { echo "could not read targetSdk from config.gradle"; exit 1; }
          if [ "$TARGET" -lt "$REQUIRED" ]; then
            echo ""
            echo "Play will reject this upload. Raise gradle_build/target_sdk in"
            echo "export_presets.cfg. This requirement rises every year - see PLAY.md."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/*.aab
          retention-days: 90

      # Attached to the tag's release, not to a rolling build number - this is
      # the file that gets uploaded to Play Console by hand.
      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.aab
          generate_release_notes: true
