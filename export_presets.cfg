; Export presets.
;
; Godot rewrites this file whenever the export dialog is touched, so read the
; diff when it does. It is checked in on purpose: the preset is what CI builds
; from, so a change to it is a change to what ships and belongs in review.
;
; Keystore paths and passwords are NOT in here. They come from
; EDITOR_SETTINGS / environment for local builds and from repository secrets in
; CI, because this file is public.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/godot-template.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
package/unique_name="com.gideon.godottemplate"
package/name="Godot Template"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()

; arm64 only. Every phone this is aimed at is 64-bit, and shipping the 32-bit
; slice as well roughly doubles the native payload for devices that no longer
; exist here. Play requires a 64-bit build regardless.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

version/code=1
version/name="0.1.0"


; ── Play release ─────────────────────────────────────────────────────────────
;
; Same game, different container. Play requires an Android App Bundle (.aab),
; not an APK, for anything published since 2021 - Google builds the per-device
; APKs from it, which is why the download a player gets is smaller than the
; artifact uploaded here.
;
; Signed with the UPLOAD key, which is not the app signing key. With Play App
; Signing enabled, Google holds the real one and this only proves the upload
; came from us - so losing it is recoverable. Enable Play App Signing.

[preset.1]

name="Android Release"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/godot-template.aab"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; AAB export is only valid with the Gradle build - the exporter refuses
; otherwise. That is why only this preset turns it on: the debug APK stays on
; the prebuilt template, which needs no Gradle and exports in seconds.
;
; The Gradle build is also the only way to set target_sdk, which Play requires
; to be 36 (Android 16) for new apps and updates from 31 August 2026, and which
; rises every year. This is the line to bump when that deadline moves.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
package/unique_name="com.gideon.godottemplate"
package/name="Godot Template"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
